<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusTech - Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">NexusTech</h1>
      <span class="badge bg-secondary">Portal Oficial</span>
    </div>
  </header>

  <nav class="bg-dark py-2 border-bottom border-secondary">
    <div class="container">
      <ul class="nav">
        <li class="nav-item"><a class="nav-link text-info fw-bold py-0" href="index.html">Acceso</a></li>
        <li class="nav-item"><a class="nav-link text-light py-0" href="catalogo.html">Catalogo</a></li>
        <li class="nav-item"><a class="nav-link text-light py-0" href="carrito.html">Carro</a></li>
      </ul>
    </div>
  </nav>

  <main class="container my-4">
    <section class="caja-login">
      <div class="row align-items-center">
        <div class="col-12 col-md-5 text-center mb-3 mb-md-0">
          <img src="https://media.giphy.com/media/qgQUggAC3Pfv687qPC/giphy.gif" alt="Animacion de PC gamer" class="img-gif">
          <p class="small text-muted mt-2 mb-0">Hardware y componentes gamer</p>
        </div>
        <article class="col-12 col-md-7">
          <h2 class="h5 fw-bold mb-2">Iniciar sesion en NexusTech</h2>
          <div class="d-flex gap-2 mb-3">
            <button type="button" id="btnAutoUser" class="btn btn-sm btn-outline-info">👤 Cuenta Cliente</button>
            <button type="button" id="btnAutoAdmin" class="btn btn-sm btn-outline-warning">🛠️ Cuenta Admin</button>
          </div>
          <form id="formLogin" novalidate>
            <div class="mb-2">
              <label for="txtCorreo" class="form-label small fw-bold">Correo electronico:</label>
              <input type="email" id="txtCorreo" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="ejemplo@correo.com">
              <span id="errCorreo" class="error-msg"></span>
            </div>
            <div class="mb-3">
              <label for="txtClave" class="form-label small fw-bold">Clave de acceso:</label>
              <input type="password" id="txtClave" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="••••••••">
              <span id="errClave" class="error-msg"></span>
            </div>
            <button type="submit" class="btn btn-primary btn-sm w-100 fw-bold py-2 mb-2">Ingresar al Sistema</button>
          </form>
          <div class="text-center mt-2">
            <a href="catalogo.html" class="text-info text-decoration-none small">
              Entrar como invitado al catalogo &rarr;
            </a>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="text-center">
    <div class="container">
      <p class="mb-1"><strong>NexusTech 2026</strong> - Tienda Virtual de Hardware</p>
      <p class="mb-0 text-muted small">Todos los derechos reservados</p>
    </div>
  </footer>

  <script src="js/funciones.js"></script>
</body>
</html>
