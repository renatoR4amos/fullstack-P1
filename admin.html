<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusTech - Administracion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">NexusTech</h1>
      <a href="catalogo.html" class="btn btn-sm btn-outline-info">Ir al Catalogo</a>
    </div>
  </header>

  <nav class="bg-dark py-2 border-bottom border-secondary">
    <div class="container">
      <ul class="nav">
        <li class="nav-item"><a class="nav-link text-light py-0" href="index.html">Acceso</a></li>
        <li class="nav-item"><a class="nav-link text-light py-0" href="catalogo.html">Catalogo</a></li>
        <li class="nav-item"><a class="nav-link text-warning fw-bold py-0" href="admin.html">Panel Admin</a></li>
      </ul>
    </div>
  </nav>

  <main class="container my-4">
    <section>
      <article class="bloque-seccion">
        <h2 class="h5 fw-bold text-warning mb-2">🛠️ Administracion de Precios y Catalogo</h2>
        <p class="small text-muted mb-3">Modifica productos de la tienda en tiempo real</p>

        <form id="formAdmin" class="row g-2 align-items-end mb-3" novalidate>
          <input type="hidden" id="adminId">
          <div class="col-12 col-md-5">
            <label for="adminNom" class="form-label small fw-bold">Nombre del Producto:</label>
            <input type="text" id="adminNom" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Ej: Mouse Gamer">
          </div>
          <div class="col-12 col-md-4">
            <label for="adminPrecio" class="form-label small fw-bold">Precio Unitario:</label>
            <input type="number" id="adminPrecio" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Ej: 29990">
          </div>
          <div class="col-12 col-md-3">
            <button type="submit" class="btn btn-warning btn-sm w-100 fw-bold">Guardar Cambio</button>
          </div>
          <div class="col-12"><span id="errAdmin" class="error-msg"></span></div>
        </form>

        <div class="table-responsive">
          <table class="table table-dark table-hover mb-0 align-middle">
            <thead>
              <tr><th>Nombre</th><th>Precio</th><th>Accion</th></tr>
            </thead>
            <tbody id="cuerpoAdmin"></tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <footer class="text-center">
    <div class="container">
      <p class="mb-1"><strong>NexusTech 2026</strong> - Tienda Virtual de Hardware</p>
      <p class="mb-0 text-muted small">Todos los derechos reservados</p>
    </div>
  </footer>

  <script src="js/funciones.js"></script>
</body>
</html>
